[project]
name = "jev-mobile"
version = "0.1.0"
description = "A phone agent that chooses instead of generating: one TypeSafe Jev decision over A11Y state, executed over ADB."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx[http2]>=0.27", "pyyaml>=5.4"]

[project.scripts]
jev-mobile = "jev_mobile.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jev_mobile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
